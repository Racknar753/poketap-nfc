
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PokéTap NFC | Pokémon Fire Red</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background: #1f2937;
      padding: 18px 12px;
    }

    h1 {
      color: #ffcb05;
      font-size: 28px;
      margin: 0;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 8px;
    }

    .game-container {
      width: 100%;
      max-width: 900px;
      margin: 15px auto;
      padding: 0 8px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 450px;
      border: none;
      background: #000;
      border-radius: 12px;
    }

    .open-game {
      display: inline-block;
      margin: 18px 0;
      padding: 12px 20px;
      background: #ffcb05;
      color: #101827;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      color: #94a3b8;
      font-size: 12px;
      padding: 15px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      iframe {
        height: 72dvh;
        min-height: 420px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 PokéTap NFC</h1>
    <p class="subtitle">
      Tu consola retro en el celular
    </p>
  </header>

  <main class="game-container">

    <iframe
      src="https://retrogames.games/embed/pokemon-fire-red-extended-v3-2"
      title="Pokemon Fire Red Extended"
      scrolling="no"
      allow="fullscreen; autoplay"
      allowfullscreen>
    </iframe>

    <a
      class="open-game"
      href="https://retrogames.games/embed/pokemon-fire-red-extended-v3-2"
      target="_blank"
      rel="noopener noreferrer">
      🎮 Abrir juego en pantalla completa
    </a>

  </main>

  <footer>
    PokéTap NFC | Experiencia retro
  </footer>

</body>
</html>
