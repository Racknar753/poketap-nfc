
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>PokéTap | Nova Forge 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background: #1f2937;
      padding: 20px 12px;
    }

    h1 {
      color: #ffcb05;
      font-size: 30px;
      margin: 12px 0 5px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
    }

    .languages {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 17px;
      font-weight: bold;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    button.active {
      background: #ffcb05;
      color: #101827;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 10px;
    }

    .game-frame {
      display: block;
      width: 100%;
      height: 72dvh;
      min-height: 430px;
      border: none;
      border-radius: 14px;
      background: #f5f1e6;
    }

    .help {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
      margin: 20px 0;
    }

    .play-link {
      display: inline-block;
      background: #ffcb05;
      color: #101827;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    footer {
      background: #1f2937;
      padding: 25px 12px;
    }

    footer h2 {
      color: #ffcb05;
      font-size: 21px;
    }

    footer p {
      color: #cbd5e1;
      font-size: 13px;
    }

    footer a {
      color: #ffcb05;
      text-decoration: none;
      font-weight: bold;
    }

    .copyright {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 26px;
      }

      .game-frame {
        height: 68dvh;
        min-height: 420px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="languages">
      <button id="esBtn" class="active"
              onclick="setLanguage('es')">
        🇪🇸 Español
      </button>

      <button id="enBtn"
              onclick="setLanguage('en')">
        🇺🇸 English
      </button>
    </div>

    <h1>🎮 PokéTap</h1>

    <p class="subtitle"
       data-es="Tu consola retro en el celular"
       data-en="Your retro console on your phone">
      Tu consola retro en el celular
    </p>

  </header>

  <main>

    <iframe
      class="game-frame"
      src="https://retrogames.games/embed/pokemon-fire-red-extended-v3-2"
      title="Pokemon Fire Red Extended"
      allow="fullscreen; autoplay"
      allowfullscreen>
    </iframe>

    <p class="help"
       data-es="¿El juego no carga? Prueba abrirlo directamente en tu navegador."
       data-en="Game not loading? Try opening it directly in your browser.">
      ¿El juego no carga? Prueba abrirlo directamente en tu navegador.
    </p>

    <a class="play-link"
       href="https://retrogames.games/embed/pokemon-fire-red-extended-v3-2"
       target="_blank"
       rel="noopener noreferrer"
       data-es="🎮 Abrir juego directamente"
       data-en="🎮 Open game directly">
      🎮 Abrir juego directamente
    </a>

  </main>

  <footer>

    <h2
      data-es="✨ Creado por Nova Forge 3D"
      data-en="✨ Created by Nova Forge 3D">
      ✨ Creado por Nova Forge 3D
    </h2>

    <p
      data-es="Impresión 3D • Cosplay • Experiencias retro"
      data-en="3D Printing • Cosplay • Retro Experiences">
      Impresión 3D • Cosplay • Experiencias retro
    </p>

    <a
      href="https://www.instagram.com/novaforge3.d/"
      target="_blank"
      rel="noopener noreferrer">
      📸 Instagram @novaforge3.d
    </a>

    <p class="copyright">
      © 2026 Nova Forge 3D
    </p>

  </footer>

  <script>
    function setLanguage(lang) {
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-es]")
        .forEach(element => {
          element.textContent =
            element.getAttribute("data-" + lang);
        });

      document.getElementById("esBtn")
        .classList.toggle("active", lang === "es");

      document.getElementById("enBtn")
        .classList.toggle("active", lang === "en");
    }
  </script>

</body>
</html>
