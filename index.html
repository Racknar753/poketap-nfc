
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PokéTap NFC | Nova Forge 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background: #1f2937;
      padding: 20px 12px;
    }

    h1 {
      color: #ffcb05;
      font-size: 28px;
      margin: 0;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 900px;
      margin: 18px auto;
      padding: 0 8px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 450px;
      border: none;
      border-radius: 12px;
      background: black;
    }

    footer {
      padding: 25px 12px;
      background: #1f2937;
      margin-top: 20px;
    }

    footer h3 {
      margin: 0 0 10px;
      color: #ffcb05;
    }

    footer p {
      color: #cbd5e1;
      font-size: 13px;
    }

    footer a {
      display: inline-block;
      color: #ffcb05;
      font-weight: bold;
      text-decoration: none;
      margin-top: 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .copyright {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      iframe {
        height: 72dvh;
        min-height: 420px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 PokéTap NFC</h1>
    <p class="subtitle">
      Tu consola retro en el celular
    </p>
  </header>

  <main class="game-container">

    <iframe
      src="https://retrogames.games/embed/pokemon-fire-red-extended-v3-2"
      title="Pokemon Fire Red Extended v3.2"
      scrolling="no"
      allowfullscreen>
    </iframe>

  </main>

  <footer>

    <h3>✨ Creado por Nova Forge 3D</h3>

    <p>
      Impresión 3D • Cosplay • Tecnología NFC
    </p>

    <a
      href="https://www.instagram.com/novaforge3.d/"
      target="_blank"
      rel="noopener noreferrer">
      📸 Síguenos en Instagram @novaforge3.d
    </a>

    <p class="copyright">
      © 2026 Nova Forge 3D
    </p>

  </footer>

</body>
</html>
