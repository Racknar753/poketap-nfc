
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>PokéTap Arcade | Nova Forge 3D</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101827;color:white;
  font-family:Arial,sans-serif;text-align:center;
}
header,footer{background:#1f2937;padding:18px}
h1{color:#ffcb05;margin:8px 0}
h2{margin:12px 0;color:#ffcb05}
p{color:#cbd5e1}
.flags button{
  font-size:22px;background:#374151;
  border:0;border-radius:9px;padding:9px;margin:3px;
}
.flags .active{background:#ffcb05}
main{max-width:520px;margin:auto;padding:12px}
.stats{
  display:flex;justify-content:space-around;
  background:#1f2937;border-radius:12px;
  padding:12px;margin:15px 0;
}
.stats strong{color:#ffcb05}
canvas{
  display:block;width:100%;max-width:460px;
  margin:auto;background:#070b20;
  border:3px solid #ffcb05;border-radius:12px;
}
.controls{
  display:grid;grid-template-columns:repeat(3,70px);
  justify-content:center;gap:5px;margin:16px auto;
}
.controls button,.actions button{
  background:#ffcb05;color:#101827;
  border:0;border-radius:12px;
  font-size:25px;font-weight:bold;
  min-height:55px;touch-action:manipulation;
  cursor:pointer;
}
.empty{visibility:hidden}
.actions{
  display:flex;gap:10px;justify-content:center;
  flex-wrap:wrap;margin:12px 0;
}
.actions button{font-size:14px;padding:0 15px}
footer a{color:#ffcb05}
small{color:#94a3b8}
</style>
</head>
<body>
<header>
  <div class="flags">
    <button id="es" class="active" onclick="lang('es')">🇪🇸</button>
    <button id="en" onclick="lang('en')">🇺🇸</button>
  </div>
  <h1>🎮 PokéTap</h1>
  <p data-es="Tu aventura arcade"
     data-en="Your arcade adventure">Tu aventura arcade</p>
</header>

<main>
  <h2>👾 MAZE CHASE</h2>
  <p data-es="¡Come todos los puntos y evita a los fantasmas!"
     data-en="Eat every dot and avoid the ghosts!">
    ¡Come todos los puntos y evita a los fantasmas!
  </p>

  <div class="stats">
    <div>⭐ <strong id="score">0</strong></div>
    <div>❤️ <strong id="lives">3</strong></div>
    <div>🏆 <strong id="best">0</strong></div>
    <div>🎯 <strong id="level">1</strong></div>
  </div>

  <canvas id="game" width="420" height="420"></canvas>

  <div class="controls">
    <span class="empty"></span>
    <button data-dir="0,-1">▲</button>
    <span class="empty"></span>
    <button data-dir="-1,0">◀</button>
    <button data-dir="0,1">▼</button>
    <button data-dir="1,0">▶</button>
  </div>

  <div class="actions">
    <button id="pause" onclick="togglePause()">⏸ Pausa</button>
    <button data-es="↻ Nueva partida"
            data-en="↻ New game"
            onclick="newGame()">↻ Nueva partida</button>
  </div>

  <p data-es="Se guarda tu progreso en este navegador."
     data-en="Your progress is saved in this browser.">
    Se guarda tu progreso en este navegador.
  </p>
</main>

<footer>
  <h2>✨ Nova Forge 3D</h2>
  <a href="https://www.instagram.com/novaforge3.d/">
    📸 @novaforge3.d
  </a>
  <p><small>© 2026 PokéTap</small></p>
</footer>

<script>
const MAP=[
"###############",
"#......#......#",
"#.###.#.#.###.#",
"#o#...#.#...#o#",
"#.#.###.###.#.#",
"#...#.....#...#",
"###.#.###.#.###",
"#.....#.#.....#",
"###.#.#.#.#.###",
"#...#.....#...#",
"#.#.###.###.#.#",
"#o#...#.#...#o#",
"#.###.#.#.###.#",
"#......#......#",
"###############"
];

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const TILE=28;
const KEY="poketap_maze_v1";
const BEST_KEY="poketap_maze_best";

const starts=[
  {x:13,y:13,color:"#ff6677"},
  {x:1,y:13,color:"#63d2ff"},
  {x:7,y:5,color:"#f6a6ff"}
];

const DIRS=[
  {x:1,y:0},{x:-1,y:0},
  {x:0,y:1},{x:0,y:-1}
];

let grid,player,ghosts,dir,wanted;
let score=0,lives=3,level=1,power=0,ticks=0;
let paused=false,over=false;
let best=0;
let language="es";

try{best=Number(localStorage.getItem(BEST_KEY))||0}catch(e){}

function positions(){
  player={x:1,y:1};
  ghosts=starts.map(g=>({...g}));
  dir={x:0,y:0};
  wanted={x:0,y:0};
  power=0;
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      grid,player,ghosts,dir,wanted,
      score,lives,level,power,ticks,paused,over
    }));
    localStorage.setItem(BEST_KEY,String(best));
  }catch(e){}
}

function restore(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s||!Array.isArray(s.grid)||s.grid.length!==15)
      return false;
    grid=s.grid;
    player=s.player;
    ghosts=s.ghosts;
    dir=s.dir;
    wanted=s.wanted;
    score=s.score;
    lives=s.lives;
    level=s.level;
    power=s.power;
    ticks=s.ticks||0;
    paused=s.paused;
    over=s.over;
    return true;
  }catch(e){return false}
}

function newGame(){
  grid=MAP.map(row=>row.split(""));
  score=0;
  lives=3;
  level=1;
  ticks=0;
  paused=false;
  over=false;
  positions();
  save();
  draw();
}

function valid(x,y){
  return grid[y] && grid[y][x] &&
         grid[y][x]!=="#";
}

function turn(x,y){
  wanted={x,y};
}

function loseLife(){
  lives--;
  if(lives<=0){
    over=true;
  }else{
    positions();
  }
}

function collisions(){
  for(let i=0;i<ghosts.length;i++){
    const g=ghosts[i];
    if(g.x===player.x && g.y===player.y){
      if(power>0){
        score+=200;
        ghosts[i]={...starts[i]};
      }else{
        loseLife();
        return true;
      }
    }
  }
  return false;
}

function moveGhosts(){
  ghosts.forEach(g=>{
    const options=DIRS.filter(d=>
      valid(g.x+d.x,g.y+d.y)
    );
    if(!options.length)return;

    let choice;
    if(Math.random()<0.65){
      choice=options.reduce((a,b)=>{
        const da=Math.abs(g.x+a.x-player.x)+
                 Math.abs(g.y+a.y-player.y);
        const db=Math.abs(g.x+b.x-player.x)+
                 Math.abs(g.y+b.y-player.y);
        return db<da?b:a;
      });
    }else{
      choice=options[Math.floor(Math.random()*options.length)];
    }
    g.x+=choice.x;
    g.y+=choice.y;
  });
}

function nextLevel(){
  level++;
  grid=MAP.map(row=>row.split(""));
  positions();
}

function step(){
  if(paused||over)return;
  ticks++;

  if(valid(player.x+wanted.x,player.y+wanted.y) &&
     (wanted.x||wanted.y)){
    dir={...wanted};
  }

  if(valid(player.x+dir.x,player.y+dir.y)){
    player.x+=dir.x;
    player.y+=dir.y;
  }

  const cell=grid[player.y][player.x];
  if(cell==="."||cell==="o"){
    score+=cell==="o"?50:10;
    if(cell==="o")power=35;
    grid[player.y][player.x]=" ";
  }

  if(collisions()){
    save();draw();return;
  }

  if(ticks%2===0){
    moveGhosts();
    if(collisions()){
      save();draw();return;
    }
  }

  if(power>0)power--;

  if(score>best)best=score;

  if(!grid.some(row=>row.some(c=>c==="."||c==="o"))){
    nextLevel();
  }

  save();
  draw();
}

function draw(){
  ctx.fillStyle="#070b20";
  ctx.fillRect(0,0,420,420);

  for(let y=0;y<15;y++){
    for(let x=0;x<15;x++){
      const c=grid[y][x];
      const px=x*TILE,py=y*TILE;

      if(c==="#"){
        ctx.fillStyle="#2344b9";
        ctx.fillRect(px+1,py+1,26,26);
        ctx.fillStyle="#425fe9";
        ctx.fillRect(px+4,py+4,20,20);
      }else if(c==="."||c==="o"){
        ctx.fillStyle=c==="o"?"#ffcb05":"#f6e7b2";
        ctx.beginPath();
        ctx.arc(px+14,py+14,c==="o"?6:2.5,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  const a=Math.atan2(dir.y,dir.x);
  const px=player.x*TILE+14;
  const py=player.y*TILE+14;
  const mouth=(ticks%2===0)?0.27:0.08;

  ctx.fillStyle="#ffdf28";
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.arc(px,py,11,a+mouth,a+Math.PI*2-mouth);
  ctx.closePath();
  ctx.fill();

  ghosts.forEach(g=>{
    const gx=g.x*TILE+14,gy=g.y*TILE+14;
    ctx.fillStyle=power>0?"#577bff":g.color;
    ctx.beginPath();
    ctx.arc(gx,gy,10,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(gx-4,gy-2,3,0,Math.PI*2);
    ctx.arc(gx+4,gy-2,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#172554";
    ctx.fillRect(gx-5,gy-3,2,3);
    ctx.fillRect(gx+3,gy-3,2,3);
  });

  if(paused||over){
    ctx.fillStyle="rgba(0,0,0,.75)";
    ctx.fillRect(0,0,420,420);
    ctx.fillStyle="#ffcb05";
    ctx.font="bold 29px Arial";
    ctx.textAlign="center";
    ctx.fillText(
      over?"GAME OVER":"PAUSA",
      210,210
    );
  }

  document.getElementById("score").textContent=score;
  document.getElementById("lives").textContent=lives;
  document.getElementById("best").textContent=best;
  document.getElementById("level").textContent=level;
}

function togglePause(){
  if(over){newGame();return}
  paused=!paused;
  save();
  draw();
  document.getElementById("pause").textContent=
    paused?"▶ Continuar":"⏸ Pausa";
}

document.querySelectorAll("[data-dir]").forEach(button=>{
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const [x,y]=button.dataset.dir.split(",").map(Number);
    turn(x,y);
  });
});

document.addEventListener("keydown",e=>{
  const keys={
    ArrowUp:[0,-1],w:[0,-1],
    ArrowDown:[0,1],s:[0,1],
    ArrowLeft:[-1,0],a:[-1,0],
    ArrowRight:[1,0],d:[1,0]
  };
  if(keys[e.key]){
    e.preventDefault();
    turn(...keys[e.key]);
  }
  if(e.key===" ")togglePause();
});

function lang(l){
  language=l;
  document.documentElement.lang=l;
  document.querySelectorAll("[data-es]").forEach(el=>{
    el.textContent=el.getAttribute("data-"+l);
  });
  document.getElementById("es").classList.toggle("active",l==="es");
  document.getElementById("en").classList.toggle("active",l==="en");
}

if(!restore())newGame();
draw();
setInterval(step,160);
</script>
</body>
</html>
